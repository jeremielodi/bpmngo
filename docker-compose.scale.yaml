# Plusieurs instances BpmnGo derrière un load balancer nginx, avec PgBouncer
# devant Postgres.
#
#   docker compose -f docker-compose.yaml -f docker-compose.scale.yaml up -d --scale bpmngo=3
#
# Ce fichier s'ajoute à docker-compose.yaml sans le modifier : sans lui,
# BpmnGo tourne comme avant, en une seule instance connectée directement à
# Postgres. Les instances partagent la même base ; tout ce qui tourne en
# tâche de fond (timers, archivage, messages, conditions) est déjà sûr à
# plusieurs, et les événements de tâches (SSE, WebSocket) sont relayés entre
# instances.
#
# PgBouncer (mode transaction) mutualise les connexions : chaque instance
# peut ouvrir beaucoup de connexions clientes, Postgres n'en voit que
# DEFAULT_POOL_SIZE. Ce qui a besoin d'une session Postgres (LISTEN, verrous
# consultatifs de l'archiveur et de la rétention) passe directement par
# Postgres (DB_DIRECT_HOST). Les délais (statement_timeout…) sont réglés
# côté Postgres : PgBouncer ne transmet pas les paramètres de démarrage.

services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
      - -c
      - statement_timeout=30000
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - hba_file=/etc/goflow/pg_hba.conf
    volumes:
      - ./deploy/pg_hba.conf:/etc/goflow/pg_hba.conf:ro

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    container_name: bpmngo-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: goflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:-goflow123}
      DB_NAME: goflow
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-80}
      MAX_PREPARED_STATEMENTS: 200
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout,idle_in_transaction_session_timeout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U goflow -d goflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - bpmngo-network
    restart: unless-stopped

  bpmngo:
    # Plusieurs répliques : pas de nom de conteneur fixe, et c'est le load
    # balancer qui publie les ports.
    container_name: !reset null
    ports: !reset []
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    environment:
      DB_HOST: pgbouncer
      DB_DIRECT_HOST: postgres
      DB_DIRECT_PORT: 5432
      TASK_EVENTS_FANOUT: "true"
      DB_READ_HOST: postgres-replica
      # With three replicas this exposes at most 120 client connections to
      # PgBouncer, which multiplexes them onto its 80 server connections.
      # Increase only after measuring wait_count in SHOW POOLS.
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-40}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}

  lb:
    image: nginx:1.29.2-alpine
    container_name: bpmngo-lb
    depends_on:
      bpmngo:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "${GRPC_PORT:-26500}:26500"
    volumes:
      - ./deploy/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bpmngo-network
    restart: unless-stopped

  # Rôle de réplication sur le primaire (idempotent), puis la réplique en
  # lecture : l'historique et l'analytics la lisent
  # (DB_READ_HOST), quelques millisecondes derrière le primaire.
  replication-setup:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: goflow
      POSTGRES_DB: goflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goflow123}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    entrypoint: ["/bin/bash", "/replication-setup.sh"]
    volumes:
      - ./deploy/replication-setup.sh:/replication-setup.sh:ro
    networks:
      - bpmngo-network
    restart: "no"

  postgres-replica:
    image: postgres:16
    container_name: bpmngo-postgres-replica
    depends_on:
      replication-setup:
        condition: service_completed_successfully
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-200}
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./deploy/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "goflow", "-d", "goflow"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - bpmngo-network
    restart: unless-stopped

volumes:
  replica_data:
