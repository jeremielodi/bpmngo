# Same capacity as bpmngo.yaml: 2 dedicated cores and 2 GiB of memory in all.
# Apply from the Camunda folder (see README, "Same capacity for both engines"):
#   docker compose -f docker-compose.yaml -f <bench>/limits/camunda.yaml up -d orchestration
# CPUs: BENCH_BPMNGO_CPUS (default "6,8"), BENCH_CAMUNDA_CPUS (default "2,4").
# Give each engine two *physical* cores, and different ones: on a machine
# with hyperthreading, logical CPUs 2 and 3 are often the same core (check
# with: docker run --rm alpine cat /sys/devices/system/cpu/cpu*/topology/thread_siblings_list).
services:
  orchestration:
    cpuset: "${BENCH_CAMUNDA_CPUS:-2,4}"
    mem_limit: 2g
